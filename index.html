const $=id=>document.getElementById(id);
const regions={Oiapoque:['Oiapoque'],Metropolitana:['Macapá','Santana']};
function updateBase(){const previous=$('base').value;$('base').replaceChildren(...regions[$('region').value].map(b=>new Option(b,b)));if(regions[$('region').value].includes(previous))$('base').value=previous;updateStaff()}
function updateStaff(){const current=$('base').value;const sorted=[...people].sort((a,b)=>Number(b[1]===current)-Number(a[1]===current)||a[0].localeCompare(b[0],'pt-BR'));$('staff').replaceChildren(...sorted.map(([name,base])=>new Option(base,name)))}
$('region').onchange=updateBase;$('base').onchange=updateStaff;updateBase();
const now=new Date(),pad=n=>String(n).padStart(2,'0');$('day').value=[now.getFullYear(),pad(now.getMonth()+1),pad(now.getDate())].join('-');$('hour').value=pad(now.getHours())+':'+pad(now.getMinutes());
const equipment = {sky:'Sky', escada:'Escada de centro'};
function updateVehicle(){
  for(const [name,type] of Object.entries(equipment)){
    const label=$('label-'+name);
    const group=label.nextElementSibling;
    const active=$('vehicle').value===type;
    label.hidden=group.hidden=!active;
    for(const input of group.querySelectorAll('input')){
      input.disabled=!active;
      if(!active) input.checked=false;
    }
  }
}
$('vehicle').addEventListener('change',updateVehicle);
window.addEventListener('pageshow',updateVehicle);
updateVehicle();
function statusValue(name){
  return $('shift').elements.namedItem(name).value || 'Não informado';
}
function rows(){
  const data=[
    ['Data',$('day').value.split('-').reverse().join('/')],['Hora de início',$('hour').value],
    ['Regional',$('region').value],['Base',$('base').value],['Prefixo',$('prefix').value.trim()],
    ['Colaborador 1',$('one').value.trim()],['Colaborador 2',$('two').value.trim()],
    ['Veículo',$('vehicle').value],['Starlink',statusValue('starlink')],['Rádio',statusValue('radio')]
  ];
  for(const [name,type] of Object.entries(equipment)){
    if($('vehicle').value===type) data.push([type,statusValue(name)]);
  }
  return data;
}
function paper(){const dl=document.querySelector('#paper dl');dl.replaceChildren();for(const [key,val] of rows()){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=val||'—';dl.append(dt,dd)}}
window.addEventListener('beforeprint',paper);$('print').onclick=()=>{if($('shift').reportValidity()){paper();window.print()}};
const bridge=document.getElementById('bridge');
document.body.style.setProperty('--scenery','url('+bridge.src+')');
function drawReport(){
  const canvas=document.createElement('canvas');
  canvas.width=1080;
  const ctx=canvas.getContext('2d');
  const fields=Object.fromEntries(rows());
  const statuses=rows().slice(8);
  function font(size,bold){
    ctx.font=(bold?'700 ':'400 ')+size+'px Arial, sans-serif';
  }
  function wrapped(value,size){
    font(size,true);
    const lines=[];
    let line='';
    for(const word of value.split(/\s+/)){
      if(line && ctx.measureText(line+' '+word).width>864){
        lines.push(line);
        line='';
      }
      for(const ch of (line?' ':'')+word){
        if(ctx.measureText(line+ch).width>864){lines.push(line);line='';}
        line+=ch;
      }
    }
    lines.push(line);
    return lines;
  }
  const prefix=wrapped(fields.Prefixo,40);
  const names=[...wrapped(fields['Colaborador 1'],32),...wrapped(fields['Colaborador 2'],32)];
  canvas.height=812+prefix.length*46+names.length*39+statuses.length*55;
  ctx.drawImage(bridge,0,0,1080,canvas.height);
  const navy='#082f51', ink='#102b46';
  function panel(x,y,w,h,r,color){
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);
    else ctx.rect(x,y,w,h);
    ctx.fillStyle=color;
    ctx.fill();
  }
  function write(value,x,y,size,bold=false,color=ink){
    font(size,bold);
    ctx.fillStyle=color;
    ctx.fillText(value,x,y);
  }
  function rule(y){ctx.fillStyle='#8295a3';ctx.fillRect(112,y,856,1);}
  panel(32,12,1016,112,22,'rgba(5,45,78,.97)');
  ctx.textAlign='center';
  write('EQUATORIAL AMAPÁ',540,55,27,true,'white');
  write('Início de turno',540,102,48,true,'white');
  ctx.textAlign='left';
  panel(64,316,952,canvas.height-338,28,'rgba(247,251,255,.83)');
  let y=357;
  write('Prefixo da equipe',112,y,26);
  for(const line of prefix){y+=46;write(line,112,y,40,true);}
  for(const pair of [['Data','Hora de início'],['Regional','Base']]){
    rule(y+18);
    y+=55;
    pair.forEach((key,i)=>{
      const x=112+i*450;
      write(key,x,y,26);
      write(fields[key],x,y+39,34,true);
    });
    y+=39;
  }
  rule(y+18);
  y+=54;
  write('Colaboradores',112,y,26);
  for(const line of names){y+=39;write(line,112,y,32,true);}
  rule(y+18);
  y+=54;
  write('Veículo',112,y,26);
  y+=38;
  write(fields['Veículo']==='Sky'?'SKY':fields['Veículo'],112,y,34,true);
  y+=20;
  panel(92,y,896,48,12,navy);
  write('Equipamentos',112,y+34,31,true,'white');
  y+=48;
  for(const [key,value] of statuses){
    const ok=value==='Funcionando',fault=value==='Não funcionando';
    const color=ok?'#096636':fault?'#ad261d':'#475866';
    write(key==='Sky'?'SKY':key,112,y+38,31,true);
    write((ok?'✓  ':fault?'×  ':'•  ')+value,575,y+38,30,true,color);
    y+=55;
    if(key!==statuses[statuses.length-1][0])rule(y);
  }
  return canvas;
}
function makeJpeg(){
  const name='Inicio_de_turno_'+$('day').value+'_'+$('prefix').value.trim().replace(/[^a-z0-9-]/gi,'_')+'.jpg';
  const url=drawReport().toDataURL('image/jpeg',0.92);
  if(!url.startsWith('data:image/jpeg;base64,')) throw new Error('JPEG indisponível');
  return {name,url};
}
function download(image){
  const link=document.createElement('a');
  link.download=image.name;
  link.href=image.url;
  document.body.append(link);
  link.click();
  link.remove();
}
$('shift').onsubmit=event=>{
  event.preventDefault();
  try{
    download(makeJpeg());
    $('msg').textContent='Download do JPEG iniciado.';
  }catch{
    $('msg').textContent='Falha ao gerar o JPEG. Tente novamente.';
  }
};
$('share').onclick=async()=>{
  if(!$('shift').reportValidity()) return;
  let image;
  try{
    image=makeJpeg();
    if(navigator.canShare && navigator.share){
      const bytes=Uint8Array.from(atob(image.url.split(',')[1]),ch=>ch.charCodeAt(0));
      const file=new File([bytes],image.name,{type:'image/jpeg'});
      const data={files:[file]};
      if(navigator.canShare(data)){
        await navigator.share(data);
        $('msg').textContent='Imagem encaminhada ao compartilhamento do celular.';
        return;
      }
    }
  }catch(error){
    if(error.name==='AbortError') return;
    if(!image){
      $('msg').textContent='Falha ao gerar o JPEG. Tente novamente.';
      return;
    }
  }
  download(image);
  $('msg').textContent='Abra o WhatsApp e anexe o JPEG baixado na conversa desejada.';
};
const exportButtons=[$('shift').querySelector('[type=submit]'),$('share')];
function allowExport(ready){exportButtons.forEach(button=>button.disabled=!ready);}
if(!bridge.complete || !bridge.naturalWidth){
  allowExport(false);
  bridge.addEventListener('load',()=>allowExport(true),{once:true});
  bridge.addEventListener('error',()=>{$('msg').textContent='Não foi possível carregar o fundo da ficha.';},{once:true});
}
</script></body></html>

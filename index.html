e}input[type=radio]{accent-color:#006c72}footer{font-size:12px;line-height:1.5;color:white;text-shadow:0 1px 4px #123}a{color:inherit}.actions{display:flex;gap:10px;margin-top:22px}button{border:0;border-radius:9px;min-height:44px;padding:11px 18px;font:600 15px inherit;font-family:inherit;font-weight:650;cursor:pointer;background:#123f5c;color:white}.secondary{color:#164159;border:1px solid #98b1bc;background:#f7fcff}button:focus-visible,:is(select,input):focus-visible{outline:3px solid #0098ad;outline-offset:2px}#paper{display:none}#msg{margin:9px 0 0;font-size:13px}#msg:empty{display:none}

const $=id=>document.getElementById(id);
const regions={Oiapoque:['Oiapoque'],Metropolitana:['Macapá','Santana']};
function updateBase(){const previous=$('base').value;$('base').replaceChildren(...regions[$('region').value].map(b=>new Option(b,b)));if(regions[$('region').value].includes(previous))$('base').value=previous;updateStaff()}
let staffOrder=[];
const normalizeName=value=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function updateStaff(){
  const base=$('base').value;
  staffOrder=[...people].sort((a,b)=>Number(b[1]===base)-Number(a[1]===base)||a[0].localeCompare(b[0],'pt-BR'));
  for(const picker of pickers) picker.close();
}
const pickers=['one','two'].map(id=>{
  const input=$(id),list=$(id+'-options'),field=input.closest('.staff-field');
  const toggle=field.querySelector('button');
  let active=-1;
  function close(){
    list.hidden=true;
    input.setAttribute('aria-expanded','false');
    input.removeAttribute('aria-activedescendant');
    active=-1;
  }
  function show(query){
    const term=normalizeName(query);
    const items=staffOrder.filter(([name])=>normalizeName(name).includes(term));
    list.replaceChildren();
    for(const [name,base] of items){
      const option=document.createElement('li');
      option.id=id+'-option-'+list.children.length;
      option.setAttribute('role','option');
      option.setAttribute('aria-selected','false');
      option.dataset.name=name;
      const note=document.createElement('small');
      note.textContent=base;
      option.append(name,note);
      list.append(option);
    }
    active=-1;
    input.removeAttribute('aria-activedescendant');
    list.hidden=items.length===0;
    input.setAttribute('aria-expanded',String(!list.hidden));
  }
  function select(option){
    input.value=option.dataset.name;
    input.focus();
    close();
    input.dispatchEvent(new Event('change',{bubbles:true}));
  }
  input.addEventListener('focus',()=>show(''));
  input.addEventListener('click',()=>{if(list.hidden)show('');});
  input.addEventListener('input',()=>show(input.value));
  toggle.addEventListener('click',()=>{
    const open=list.hidden;
    input.focus();
    if(open)show('');else close();
  });
  list.addEventListener('mousedown',event=>event.preventDefault());
  list.addEventListener('click',event=>{
    const option=event.target.closest('[role=option]');
    if(option)select(option);
  });
  input.addEventListener('keydown',event=>{
    if(event.key==='Escape'){close();return;}
    if(event.key==='Enter' && !list.hidden && active>=0){
      event.preventDefault();select(list.children[active]);return;
    }
    if(!['ArrowDown','ArrowUp'].includes(event.key))return;
    event.preventDefault();
    if(list.hidden)show(input.value);
    if(!list.children.length)return;
    if(active>=0)list.children[active].setAttribute('aria-selected','false');
    active=(active+(event.key==='ArrowDown'?1:-1)+list.children.length)%list.children.length;
    const option=list.children[active];
    option.setAttribute('aria-selected','true');
    input.setAttribute('aria-activedescendant',option.id);
    option.scrollIntoView({block:'nearest'});
  });
  document.addEventListener('pointerdown',event=>{if(!field.contains(event.target))close();});
  document.addEventListener('focusin',event=>{if(!field.contains(event.target))close();});
  return {close};
});
$('region').onchange=updateBase;$('base').onchange=updateStaff;updateBase();
const now=new Date(),pad=n=>String(n).padStart(2,'0');$('day').value=[now.getFullYear(),pad(now.getMonth()+1),pad(now.getDate())].join('-');$('hour').value=pad(now.getHours())+':'+pad(now.getMinutes());
const equipment = {sky:'Sky', escada:'Escada de centro'};
function updateVehicle(){
  for(const [name,type] of Object.entries(equipment)){
    const label=$('label-'+name);
    const group=label.nextElementSibling;
    const active=$('vehicle').value===type;
    label.hidden=group.hidden=!active;
    for(const input of group.querySelectorAll('input')){
      input.disabled=!active;
      if(!active) input.checked=false;
    }
  }
}
$('vehicle').addEventListener('change',updateVehicle);
window.addEventListener('pageshow',updateVehicle);
updateVehicle();
function statusValue(name){
  return $('shift').elements.namedItem(name).value || 'Não informado';
}
const latitude=$('latitude'),longitude=$('longitude');
function validateLocation(){
  const lat=latitude.value.trim(),lon=longitude.value.trim();
  for(const [input,value,limit] of [[latitude,lat,90],[longitude,lon,180]]){
    const number=Number(value.replace(',','.'));
    const valid=/^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(value);
    input.setCustomValidity(!lat && !lon ? '' : !value ? 'Preencha as duas coordenadas.' :
      !valid || Math.abs(number)>limit ? 'Informe um valor decimal entre -'+limit+' e '+limit+'.' : '');
  }
}
for(const input of [latitude,longitude]) input.addEventListener('input',validateLocation);
$('locate').onclick=()=>{
  const msg=$('geoMsg');
  if(!navigator.geolocation){msg.textContent='Digite as coordenadas manualmente.';return;}
  $('locate').disabled=true;
  msg.textContent='Obtendo localização…';
  navigator.geolocation.getCurrentPosition(position=>{
    latitude.value=position.coords.latitude.toFixed(6);
    longitude.value=position.coords.longitude.toFixed(6);
    validateLocation();
    $('locate').disabled=false;
    msg.textContent='Coordenadas preenchidas.';
  },()=>{
    $('locate').disabled=false;
    msg.textContent='Localização indisponível. Digite as coordenadas manualmente.';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
function rows(){
  const data=[
    ['Data',$('day').value.split('-').reverse().join('/')],['Hora de início',$('hour').value],
    ['Regional',$('region').value],['Base',$('base').value],['Prefixo',$('prefix').value.trim()],
    ['Colaborador 1',$('one').value.trim()],['Colaborador 2',$('two').value.trim()],
    ['Veículo',$('vehicle').value],['Starlink',statusValue('starlink')],['Rádio',statusValue('radio')]
  ];
  for(const [name,type] of Object.entries(equipment)){
    if($('vehicle').value===type) data.push([type,statusValue(name)]);
  }
  if(latitude.value.trim() && longitude.value.trim()){
    data.push(['Coordenadas',[latitude,longitude].map(input=>Number(input.value.trim().replace(',','.')).toFixed(6)).join(' / ')]);
  }
  return data;
}
function paper(){const dl=document.querySelector('#paper dl');dl.replaceChildren();for(const [key,val] of rows()){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=val||'—';dl.append(dt,dd)}}
window.addEventListener('beforeprint',paper);$('print').onclick=()=>{if($('shift').reportValidity()){paper();window.print()}};
const bridge=document.getElementById('bridge');
document.body.style.setProperty('--scenery','url('+bridge.src+')');
function drawReport(){
  const canvas=document.createElement('canvas');
  canvas.width=1044;
  const ctx=canvas.getContext('2d');
  const data=rows(), fields=Object.fromEntries(data);
  const icons={'Regional':'📍','Base':'🏢','Veículo':'🛠️','Data':'📅','Hora de início':'🕒','Prefixo':'👷','Colaborador 1':'⛑','Colaborador 2':'⛑','Starlink':'📡','Rádio':'📻','Sky':'🛠️','Escada de centro':'🪜','Coordenadas':'📍'};
  function lines(text,width,size,bold=false){
    ctx.font=(bold?'700 ':'400 ')+size+'px Turno,Arial,sans-serif';
    const result=[];
    let line='';
    for(const word of text.trim().split(/\s+/)){
      if(line && ctx.measureText(line+' '+word).width>width){result.push(line);line='';}
      for(const ch of (line?' ':'')+word){
        if(line && ctx.measureText(line+ch).width>width){result.push(line);line='';}
        line+=ch;
      }
    }
    result.push(line);
    return result;
  }
  const order=['Regional','Base','Veículo','Data','Hora de início','Prefixo','Colaborador 1','Colaborador 2','Starlink','Rádio','Sky','Escada de centro','Coordenadas'];
  const records=order.filter(key=>key in fields).map(key=>{
    const label=({'Hora de início':'Hora','Prefixo':'Equipe','Colaborador 1':'Eletricista 1','Colaborador 2':'Eletricista 2','Sky':'SKY'})[key]||key;
    const value=fields[key]==='Sky'?'SKY':fields[key];
    const parts=lines(value,635,25);
    return {key,label,parts,height:70+(parts.length-1)*34};
  });
  const title=lines(fields.Prefixo,960,74,true);
  const top=240+(title.length-1)*82;
  const boxHeight=records.reduce((sum,r)=>sum+r.height,26);
  canvas.height=top+boxHeight+84;
  const scale=Math.max(canvas.width/bridge.width,canvas.height/bridge.height);
  const w=bridge.width*scale,h=bridge.height*scale;
  ctx.drawImage(bridge,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
  ctx.fillStyle='rgba(0,0,0,.61)';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='white';ctx.textAlign='center';
  ctx.font='700 38px Turno,Arial,sans-serif';ctx.fillText('⚡ INÍCIO DE TURNO',522,98);
  ctx.font='700 74px Turno,Arial,sans-serif';
  title.forEach((line,i)=>ctx.fillText(line,522,198+82*i));
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(32,top,980,boxHeight,26);else ctx.rect(32,top,980,boxHeight);
  ctx.fillStyle='rgba(0,0,0,.43)';ctx.fill();
  let y=top+55;ctx.textAlign='left';
  for(const row of records){
    ctx.font='28px sans-serif';ctx.fillStyle='white';ctx.fillText(icons[row.key],84,y);
    ctx.font='700 27px Turno,Arial,sans-serif';ctx.fillText(row.label+':',134,y,185);
    ctx.font='400 25px Turno,Arial,sans-serif';
    row.parts.forEach((line,i)=>ctx.fillText(line,328,y+i*34));
    y+=row.height;
  }
  const logo=$('brandLogo'),logoHeight=40,logoWidth=logoHeight*logo.naturalWidth/logo.naturalHeight;
  ctx.fillStyle='white';ctx.fillRect(36,canvas.height-67,logoWidth+24,56);
  ctx.drawImage(logo,48,canvas.height-59,logoWidth,logoHeight);
  return canvas;
}
function makeJpeg(){
  const name='Inicio_de_turno_'+$('day').value+'_'+$('prefix').value.trim().replace(/[^a-z0-9-]/gi,'_')+'.jpg';
  const url=drawReport().toDataURL('image/jpeg',0.92);
  if(!url.startsWith('data:image/jpeg;base64,')) throw new Error('JPEG indisponível');
  return {name,url};
}
function download(image){
  const link=document.createElement('a');
  link.download=image.name;
  link.href=image.url;
  document.body.append(link);
  link.click();
  link.remove();
}
$('shift').onsubmit=event=>{
  event.preventDefault();
  try{
    download(makeJpeg());
    $('msg').textContent='Download do JPEG iniciado.';
  }catch{
    $('msg').textContent='Falha ao gerar o JPEG. Tente novamente.';
  }
};
$('share').onclick=async()=>{
  if(!$('shift').reportValidity()) return;
  let image;
  try{
    image=makeJpeg();
    if(navigator.canShare && navigator.share){
      const bytes=Uint8Array.from(atob(image.url.split(',')[1]),ch=>ch.charCodeAt(0));
      const file=new File([bytes],image.name,{type:'image/jpeg'});
      const data={files:[file]};
      if(navigator.canShare(data)){
        await navigator.share(data);
        $('msg').textContent='Imagem encaminhada ao compartilhamento do celular.';
        return;
      }
    }
  }catch(error){
    if(error.name==='AbortError') return;
    if(!image){
      $('msg').textContent='Falha ao gerar o JPEG. Tente novamente.';
      return;
    }
  }
  download(image);
  $('msg').textContent='Abra o WhatsApp e anexe o JPEG baixado na conversa desejada.';
};
const exportButtons=[$('shift').querySelector('[type=submit]'),$('share')];
function allowExport(ready){exportButtons.forEach(button=>button.disabled=!ready);}
allowExport(false);
const backgroundReady=bridge.complete && bridge.naturalWidth ? Promise.resolve() : bridge.decode();
const fontsReady=document.fonts ? Promise.all([400,700].map(weight=>document.fonts.load(weight+' 32px Turno'))).catch(()=>{}) : Promise.resolve();
Promise.all([backgroundReady,fontsReady,$('brandLogo').decode()]).then(()=>allowExport(true)).catch(()=>{
  $('msg').textContent='Não foi possível carregar o fundo da ficha.';
});
